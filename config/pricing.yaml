# Pricing rules for Brands Warehouse. Everything here is tunable without
# touching code; `python -m bw.cli explain-price` shows the effect of a change
# on a real item before you commit to it.

currency: CAD

# What Shopify Payments takes off the top. Folded into the margin floor so the
# margin we quote is the margin that actually lands.
payment:
  rate: 0.029
  fixed: 0.30

# Per-supplier order costs.
#
# Ace bills a flat $15 per ORDER, not per item. Two things follow.
#
# First, the fee is brutal on a $25 bottle and trivial on a $200 one, so rather
# than spread it evenly we load it onto the cheap end: below `fee_full_below`
# an item carries the whole share, the load tapers off linearly, and above
# `fee_free_above` it is treated as covered.
#
# Second -- and this is the lever worth the most -- an item only has to carry
# the WHOLE fee if every customer buys exactly one thing. On Brands Warehouse's
# real orders the average basket is 2.89 items. But 37% of orders are a single
# item, so pricing on the average alone loses money on those: simulated against
# real order history, dividing by 2.9 with nothing behind it puts 4 orders in 94
# under water. Dividing by 2 does not, and unlocks 670 more listable items.
#
# `python -m bw.cli fee-policy` replays every option against real orders.
# Change these two numbers there first, not here.
suppliers:
  ace:
    order_fee: 15.00
    expected_units: 2         # deliberately under the real 2.89 average
    # Shipping actually charged below the $75 threshold, read off the live
    # delivery profile rather than assumed: $9.99 in Ontario/Quebec and $14.99
    # for the rest of Canada, on a parcel under 750g (a 100ml bottle is ~460g).
    #
    # The LOWER of the two on purpose. Pricing on $14.99 would assume every
    # order pays the out-of-province rate and come up short on every order from
    # the home market; at $9.99 the out-of-province orders simply come in
    # ahead. It costs almost nothing either way -- median price is $80.95 for
    # both, and 35% off retail instead of 36%.
    shipping_recovers: 9.99
    fee_full_below: 60.00
    fee_free_above: 150.00
  ace_api:           # the same Ace terms over a dealer API
    order_fee: 15.00
    fee_full_below: 60.00
    fee_free_above: 150.00
  ace_file:          # the same Ace terms, read from a file export
    order_fee: 15.00
    fee_full_below: 60.00
    fee_free_above: 150.00
  ace_stocked:       # Ace goods bought in and held here: no per-order fee
    order_fee: 0
  ace_wholesale:     # Ace's second list; orderable a single piece at a time,
                     # so the same per-order terms as dropship apply
    order_fee: 15.00
    expected_units: 2
    shipping_recovers: 9.99
    fee_full_below: 60.00
    fee_free_above: 150.00
  ace_wholesale_stocked:   # the same goods bought in and held here
    order_fee: 0
  ace_storefront:    # same Ace terms, catalogue read from their shop
    order_fee: 15.00
    fee_full_below: 60.00
    fee_free_above: 150.00
  onhand:            # our own stock in the Oakville warehouse - no dropship fee
    order_fee: 0
  consignment:       # partner stock we list but do not own
    order_fee: 0

# Minimum gross margin, as a share of the selling price, AFTER supplier cost,
# the allocated order fee and payment processing. This is the hard floor: the
# competitor-keyed price is never allowed below it.
margin_floor:
  bands:
    - max_price: 40.00
      min_margin: 0.45
    - max_price: 80.00
      min_margin: 0.38
    - max_price: 150.00
      min_margin: 0.32
    - max_price: null
      min_margin: 0.28

# How we price against the competition when we have a market price.
market:
  undercut: 0.05          # aim this far under the market price
  min_undercut: 1.00      # ...but at least this many dollars under
  msrp_cap: 0.95          # never ask more than 95% of MSRP
  # When the market price is below our floor we cannot win that item on price.
  # It gets flagged rather than sold at a loss.
  flag_below_floor: true

  # Ace's cost list carries a market retail reference per item, which lands
  # here as the item's MSRP. If our floor is above it, we cannot sell the thing
  # at a normal market price and still cover the order fee -- so it is held
  # back rather than listed as the dearest option in the market. Turning this
  # off lists them anyway, priced above retail.
  hold_above_msrp: true

  # The competitiveness ceiling. Clearing the margin floor only means an item
  # makes money IF it sells; this is the other half. Median pricing lands at
  # 68% of retail, which is proper discount territory -- but a fifth of the
  # catalogue lands above 85%, profitable and unsellable, because someone
  # shopping a discount site will not pay near-retail here.
  #
  # Lowering the margin bands is the wrong fix: it costs real money on the 80%
  # that are already keen in order to rescue items whose cost is simply too
  # close to retail. Holding those back costs nothing.
  max_share_of_retail: 0.85

# Charm rounding. Rounding may pull a price down by at most `max_markdown`,
# and never below the margin floor.
rounding:
  endings: [0.99, 0.95]
  max_markdown: 6.00

# Cart-level policy. `shipping-threshold` tests these against real orders.
order:
  # $75, which is what the storefront already advertises and the lowest
  # threshold in the competitor set. An earlier version of this file said $99
  # on the reasoning that it recovers more of the fee. Replaying real orders
  # says that was optimising the wrong number: $75 and $99 both come out with
  # ZERO losing orders, and $75 gives free shipping to 41% of customers
  # instead of 18%. Coverage of the fee is not the goal; not losing money is,
  # and $75 already clears it.
  free_shipping_threshold: 75.00
  shipping_fee: 12.99

  # What the competition does, for reference. CHECK THESE BEFORE RELYING ON
  # THEM -- they were read off the web in September 2026 and shipping terms
  # change without notice.
  competitor_thresholds:
    fragrancebuy.ca: 149.00        # also free on 5+ different SKUs
    fragrance365.ca: 120.00
    eleganscents.ca: 0.00          # free on everything
    # thefragranceshop.ca: flat $14.95 Ontario/Quebec, $18 elsewhere, no threshold found
