# Where stock comes from. Each entry tells the pipeline how to reach a source
# and what its columns/fields are called; nothing else in the code knows or
# cares which supplier it is dealing with.
#
# Credentials are never written here -- ${ACE_TOKEN} and friends are read from
# the environment (see .env.example).

suppliers:

  # ---------------------------------------------------------------- ACE ----
  # acegiftsplus.ca. They run their own Shopify store, so their catalog --
  # titles, brands, sizes, images and what is in stock right now -- is readable
  # from /products.json. Dropship; $15 flat fee per order.
  #
  # What that feed does NOT carry is our dealer cost: the price it shows is
  # Ace's retail. The `cost` block says where cost really comes from. Until it
  # is set, every item reports as unsellable rather than being guessed at --
  # which is the correct answer, not a bug.
  #
  # Their retail price is still used: it becomes the item's MSRP, so we never
  # list above Ace's own shelf price (see hold_above_msrp in pricing.yaml).
  ace:
    kind: shopify_store
    domain: acegiftsplus.ca
    # collection: fragrances      # limit to one collection if you'd rather
    page_size: 250
    delay_seconds: 0.5
    cost:
      # price_list     - join our wholesale list on SKU. Most accurate; use this
      #                  if Ace sends a dealer price list.
      # dealer_discount- a flat % off their retail. Quick, and close enough to
      #                  plan with, but check a few against a real invoice.
      # field          - a cost field their feed exposes to dealer logins.
      mode: dealer_discount
      dealer_discount: 0.40       # <-- CONFIRM THIS. See the note in the README:
                                  #     at 0.40 almost nothing clears the floor.
      price_list_path: data/ace_wholesale.csv
      price_list_sku_column: sku
      price_list_cost_column: cost
    qty:
      # /products.json says in stock or not, never how many. Items marked
      # available are listed with this count so Shopify tracks them sensibly.
      available_qty: 5
      # If a dealer login exposes real numbers, name the field and it wins:
      # field: inventory_quantity

  # If Ace turns out to have a proper dealer API as well, describe it here and
  # run `plan ace_api` instead -- same pricing, same fee rules.
  ace_api:
    kind: http
    base_url: ${ACE_BASE_URL}
    auth:
      mode: ${ACE_AUTH_MODE}          # bearer | header | basic | session | none
      token: ${ACE_TOKEN}
      username: ${ACE_USERNAME}
      password: ${ACE_PASSWORD}
      login_path: /api/auth/login
      username_field: username
      password_field: password
      token_path: data.token
    catalog:
      path: /api/v1/products
      method: GET
      items_path: data
      page_param: page
      page_size_param: per_page
      page_size: 250
      delay_seconds: 0.25
    fields:
      supplier_sku: [sku, item_code, id]
      title: [name, description, item_name]
      brand: [brand, manufacturer]
      cost: [price, wholesale_price, dealer_price]
      qty: [qty, quantity, available_qty, stock]
      barcode: [upc, ean, barcode]
      msrp: [msrp, retail_price, list_price]
      size: [size, volume]
      concentration: [concentration, type]
      gender: [gender]
      image_urls: [images, image_url, image]
      description: [long_description, details]

  # Same supplier, same $15 fee, read from a file instead of the API. Use this
  # to run the whole pipeline today on a portal export (CSV) while the API
  # details are still being confirmed:
  #   ACE_FILE=~/Downloads/ace-export.csv python -m bw.cli plan ace_file
  ace_file:
    kind: csv
    path: ${ACE_FILE}
    fields:
      supplier_sku: [sku, SKU, Item Code, item_code]
      title: [name, Item Name, Description, title]
      brand: [brand, Brand]
      cost: [price, Price, Cost, Dealer Price]
      qty: [qty, Qty, Available QTY, Quantity, Stock]
      barcode: [upc, UPC, Barcode, EAN]
      msrp: [msrp, MSRP, Retail]
      size: [size, Size, Volume]
      concentration: [Concentration, concentration]
      gender: [Gender, gender]
      image_urls: [image_url, Image, Image URL]

  # A PDF price list, converted by tools/parse_pricelist.py. This is the most
  # accurate cost we can have -- it is what we actually pay -- and it carries
  # live quantities too, so it works as a full feed on its own.
  #   python tools/parse_pricelist.py price_list.pdf -o data/ace_wholesale.csv
  ace_pricelist:
    kind: csv
    path: data/ace_wholesale.csv
    fields:
      supplier_sku: [sku]
      title: [title]
      brand: [brand]
      cost: [cost]
      qty: [qty]
      barcode: [barcode]
      size: [size]
      concentration: [concentration]
      gender: [gender]

  # ------------------------------------------------------------ ON HAND ----
  # Our own stock in the Oakville warehouse. No dropship fee, so it prices
  # cheaper than the same bottle from Ace.
  onhand:
    kind: sheet
    # A Google Sheet works directly -- File > Share > Publish to web > CSV,
    # or the /export?format=csv link.
    url: ${ONHAND_SHEET_CSV_URL}
    fields:
      supplier_sku: [SKU, Sku, sku]
      title: [Product Name, Title, Item Name]
      brand: [Brand]
      cost: [Cost, Unit Cost, Our Cost]
      qty: [Qty On Hand, Qty, Quantity]
      barcode: [Barcode, UPC]
      msrp: [MSRP, Retail]
      size: [Size, Size / Variant]
      image_urls: [Image, Image URL]

  # --------------------------------------------------------- CONSIGNMENT ----
  # Stock a partner lets us list but that we do not own. Same shape as onhand;
  # keep one entry per partner so stock and payouts stay separable.
  consignment:
    kind: sheet
    url: ${CONSIGNMENT_SHEET_CSV_URL}
    fields:
      supplier_sku: [SKU, Sku]
      title: [Product Name, Title]
      brand: [Brand]
      cost: [Cost, Our Cost, Partner Cost]
      qty: [Qty On Hand, Qty]
      barcode: [Barcode, UPC]
      size: [Size]
      image_urls: [Image, Image URL]
