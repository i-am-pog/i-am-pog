# Where stock comes from. Each entry tells the pipeline how to reach a source
# and what its columns/fields are called; nothing else in the code knows or
# cares which supplier it is dealing with.
#
# Credentials are never written here -- ${ACE_TOKEN} and friends are read from
# the environment (see .env.example).

suppliers:

  # ---------------------------------------------------------------- ACE ----
  # BW_Dropship_COST_INTERNAL.xlsx -- 6,574 lines, every one Supplier: Ace.
  # This is the authoritative source: it carries what we actually pay and a
  # market retail reference for every item.
  #
  # The companion BW_Dropship_Price_List.xlsx adds nothing -- same SKUs, and
  # its "Price (CAD)" is this file's "My Price" to the cent. One file is enough.
  #
  # Columns used:
  #   My Cost      -> cost. What we pay Ace. NOT "My Price", which is what we
  #                   charge our own dropship customers at a 20% margin.
  #   Retail (ref) -> msrp. Market retail, so the pricing engine keeps us under
  #                   it and can use it as a compare-at price.
  #
  # Three things this file does NOT have, all of which matter:
  #   - no stock column. The list states everything was in stock when it was
  #     published (15 Sep 2026), which is not the same as live. `assume_qty`
  #     below is a holding value; see the README.
  #   - no barcodes, so matching against our catalogue falls back to
  #     brand + product + size. Check the review file on the first run.
  #   - no images. Listings need photos from somewhere else -- ace_storefront
  #     below is the obvious candidate.
  ace:
    kind: xlsx
    path: data/ace_dropship_cost.xlsx
    sheet: Dropship Cost List
    assume_qty: 3
    fields:
      supplier_sku: [BW SKU]
      title: [Product]
      brand: [Brand]
      cost: [My Cost]
      msrp: [Retail (ref)]
      size: [Size / Variant]

  # The same list costed as if we bought it in and held it here: no $15 per
  # order, our money tied up instead. `compare-sources ace,ace_stocked` is the
  # "what is worth stocking?" question.
  ace_stocked:
    kind: xlsx
    path: data/ace_dropship_cost.xlsx
    sheet: Dropship Cost List
    assume_qty: 3
    fields:
      supplier_sku: [BW SKU]
      title: [Product]
      brand: [Brand]
      cost: [My Cost]
      msrp: [Retail (ref)]
      size: [Size / Variant]

  # acegiftsplus.ca. Not a cost source -- its prices are retail -- but it is
  # where the product photos are, and it knows what is in stock right now.
  ace_storefront:
    kind: shopify_store
    domain: acegiftsplus.ca
    # Their Cloudflare refuses this machine on every path, so the pages are
    # saved from a browser instead (data/ace_storefront/URLS.txt lists them).
    # Drop `files` to go back to fetching if that ever stops being true.
    files: data/ace_storefront/page-*.json
    page_size: 250
    delay_seconds: 0.5
    auth:
      cookie: ${ACE_SESSION_COOKIE}
      storage_state: data/.ace_session.json
    cost:
      mode: price_list
      price_list_path: data/ace_wholesale.csv
      price_list_sku_column: sku
      price_list_cost_column: cost
    qty:
      available_qty: 5

  # ------------------------------------------------------- ACE WHOLESALE ----
  # A SECOND Ace list, on different terms to the dropship one, and it is not a
  # subset: 1,826 of its 2,952 variants are absent from the dropship file and
  # 1,638 appear in no other Ace source we hold. Big designer houses are in
  # here that the dropship list simply does not carry.
  #
  # Two things it has that the dropship list does not:
  #   qty      -- real stock numbers, not the `assume_qty: 3` holding value.
  #   barcode  -- so matching against our catalogue can use the reliable key
  #               instead of falling back to brand + product + size.
  #
  # And one thing it lacks, which matters: no retail reference. Without an
  # msrp the engine has no compare-at price and, more to the point, the "never
  # price above the bottle's own retail" guard cannot fire -- the guard that
  # caught a $236.99 listing against a $209 retail. On these items the only
  # ceiling is a competitor price, where one exists. Check the no-retail count
  # the plan reports before publishing any of them.
  ace_wholesale:
    kind: sheet
    path: data/ace_wholesale.csv
    fields:
      supplier_sku: [sku]
      barcode: [barcode]
      title: [title]
      brand: [brand]
      cost: [cost]
      qty: [qty]
      size: [size]
      concentration: [concentration]
      gender: [gender]

  # The same list priced as if we bought it in and held it here: no $15 per
  # order, our money tied up instead. `compare-sources ace_wholesale,ace_wholesale_stocked`
  # is the "what is worth stocking?" question for this list.
  ace_wholesale_stocked:
    kind: sheet
    path: data/ace_wholesale.csv
    fields:
      supplier_sku: [sku]
      barcode: [barcode]
      title: [title]
      brand: [brand]
      cost: [cost]
      qty: [qty]
      size: [size]
      concentration: [concentration]
      gender: [gender]

  # ------------------------------------------------------------ ON HAND ----
  # Our own stock in the Oakville warehouse. No dropship fee, so it prices
  # cheaper than the same bottle from Ace.
  onhand:
    kind: sheet
    # A Google Sheet works directly -- File > Share > Publish to web > CSV,
    # or the /export?format=csv link.
    url: ${ONHAND_SHEET_CSV_URL}
    fields:
      supplier_sku: [SKU, Sku, sku]
      title: [Product Name, Title, Item Name]
      brand: [Brand]
      cost: [Cost, Unit Cost, Our Cost]
      qty: [Qty On Hand, Qty, Quantity]
      barcode: [Barcode, UPC]
      msrp: [MSRP, Retail]
      size: [Size, Size / Variant]
      image_urls: [Image, Image URL]

  # --------------------------------------------------------- CONSIGNMENT ----
  # Stock a partner lets us list but that we do not own. Same shape as onhand;
  # keep one entry per partner so stock and payouts stay separable.
  consignment:
    kind: sheet
    url: ${CONSIGNMENT_SHEET_CSV_URL}
    fields:
      supplier_sku: [SKU, Sku]
      title: [Product Name, Title]
      brand: [Brand]
      cost: [Cost, Our Cost, Partner Cost]
      qty: [Qty On Hand, Qty]
      barcode: [Barcode, UPC]
      size: [Size]
      image_urls: [Image, Image URL]
